[phases.setup]
nixPkgs = ["nodejs_18", "python312", "dotnet-sdk_9", "git", "jdk", "curl"]

[phases.install]
cmds = [
  "npm install",
  "python3.12 -m venv /opt/venv",
  "/opt/venv/bin/pip install -r requirements.txt",
  "echo 'export PATH=/opt/venv/bin:$PATH' >> ~/.bashrc",
  "mkdir -p tools",
  "git clone https://github.com/0x251/Prometheus-Deobfuscator.git tools/prometheus",
  "git clone https://github.com/hutaoshusband/Prometheus-WeAre-Devs-Dumper.git tools/wearedevs",
  "git clone https://github.com/tupsutumppu/MoonsecDeobfuscator.git tools/moonsec",
  "cd tools/moonsec && dotnet publish -c Release -o /app/moonsec_bin",
  "curl -L https://github.com/FModel/unluac/releases/download/1.2.3/unluac.jar -o /app/unluac.jar",
  "curl -L https://github.com/1-3-7/disrobe/releases/latest/download/disrobe-linux-amd64 -o /app/disrobe && chmod +x /app/disrobe"
]
